name: apm-plackage-terraform
version: 0.1.2
description: Agent configuration for Terraform projects. Standardises module layout, formatting / lint workflow, and pulls in the official HashiCorp Terraform MCP server from the apm registry.

dependencies:
  apm:
    - mazrean/apm-plackage/common
  mcp:
    # Official HashiCorp Terraform MCP server: provider docs, registry search, module metadata.
    - name: terraform
      registry: false
      transport: stdio
      command: terraform-mcp-server
      args: ["stdio"]
