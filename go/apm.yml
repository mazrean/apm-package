name: apm-package-go
version: 0.3.1
description: Agent configuration for Go projects (libraries, CLIs, servers). Standardises on mazrean/kessoku for compile-time DI and a per-repo `tools/lint` Go module for linting. Bundles the gopls MCP server for code intelligence.

dependencies:
  apm:
    - mazrean/apm-package/common
    - mazrean/agent-skills/skills/using-go-tool-directive
  mcp:
    # Go LSP exposed as an MCP server (see `gopls mcp` in golang.org/x/tools).
    - name: gopls
      registry: false
      transport: stdio
      command: gopls
      args: ["mcp"]
